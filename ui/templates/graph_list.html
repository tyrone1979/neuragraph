{% extends "base.html" %}
{% block content %}
<title>Workflow</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/graph_list.css') }}">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Workflow</h1>
        <a href="/graph/new" class="btn btn-success">
            <i class="fas fa-plus"></i> Create New Workflow
        </a>
    </div>

    <div class="mb-4">
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Search by name, family id, or version id...">
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="graphGrid">
        <!-- JS renders grouped workflow families -->
    </div>

    <div id="noResults" class="text-center py-5 text-muted d-none">
        <h4>No workflow found</h4>
    </div>

    <div class="modal fade" id="versionsModal" tabindex="-1" aria-labelledby="versionsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="versionsModalLabel">Versions</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="versionsModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/graphs.js') }}"></script>
<script>
    const graphFamiliesData = {{ families | tojson }};
</script>
{% endblock %}
