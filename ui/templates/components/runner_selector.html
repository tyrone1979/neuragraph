{# templates/components/runner_selector.html #}
{% macro runner_selector(id_prefix="runner", label="Runner", required=true, runner_obj=none) %}
<div class="mb-3">
    <div class="position-relative">
        <label for="{{ id_prefix }}Search"> {{ label }} {% if required %}
            <span class="text-danger">*</span>{% endif %}</label>
        <input type="text"
                                                          class="form-control"
                                                          id="{{ id_prefix }}Search"
                                                          placeholder="Search Agent or Workflow by name/ID..."
                                                          autocomplete="off"
                                                          value="{{ runner_obj.display if runner_obj else '' }}"
                                                          {% if required %}required{% endif %} >
        <ul class="list-group position-absolute w-100 mt-1 shadow" 
            id="{{ id_prefix }}Suggestions" 
            style="z-index: 1000; display: none; max-height: 300px; overflow-y: auto;"></ul>
    </div>
    <div class="form-text">Type to search existing agents/workflows</div>
</div>

<input type="hidden" name="runner_type" id="{{ id_prefix }}Type" value="{{ runner_obj.type if runner_obj else '' }}">
<input type="hidden" name="runner_id" id="{{ id_prefix }}Id" value="{{ runner_obj.id if runner_obj else '' }}">
<input type="hidden" name="runner_display" id="{{ id_prefix }}Display" value="{{ runner_obj.display if runner_obj else '' }}">
<script>
$(function() {
    var searchInput = $('#{{ id_prefix }}Search');
    var suggestions = $('#{{ id_prefix }}Suggestions');
    var $display = $('#{{ id_prefix }}Display');
    var $type = $('#{{ id_prefix }}Type');
    var $id = $('#{{ id_prefix }}Id');
    var selected = null;

    // Cache initial values from server-side rendering (pre-populated)
    var _lastSelectedDisplay = $display.val() || '';
    var _lastSelectedType = $type.val() || '';
    var _lastSelectedId = $id.val() || '';

    searchInput.on('input', function() {
        var q = $(this).val().trim();
        suggestions.empty().hide();

        // Only clear hidden fields if user typed something that doesn't match
        // the currently selected runner. This prevents accidental clears when
        // the input is pre-populated and the user just clicks in/out.
        var currentSelectionDisplay = $display.val() || _lastSelectedDisplay;
        if (q !== currentSelectionDisplay) {
            $display.val('');
            $type.val('');
            $id.val('');
            selected = null;
        }
        if (q.length < 2) return;

        $.getJSON('/common/api/search_runners', {q: q}, function(data) {
            if (data.results.length === 0) {
                suggestions.append('<li class="list-group-item text-muted">No results</li>').show();
                return;
            }
            data.results.forEach(function(r) {
                var item = $('<li class="list-group-item list-group-item-action" style="cursor:pointer;"></li>').text(r.display);
                item.click(function() {
                    searchInput.val(r.display);
                    $display.val(r.display);
                    $type.val(r.type);
                    $id.val(r.id);
                    _lastSelectedDisplay = r.display;
                    _lastSelectedType = r.type;
                    _lastSelectedId = r.id;
                    selected = r;
                    suggestions.hide();
                    if (typeof window.onRunnerSelected === 'function') {
                        window.onRunnerSelected(r);
                    }
                });
                suggestions.append(item);
            });
            suggestions.show();
        });
    });

    // 点击外部隐藏
    $(document).click(function(e) {
        if (!$(e.target).closest('#{{ id_prefix }}Search, #{{ id_prefix }}Suggestions').length) {
            suggestions.hide();
        }
    });
});
</script>
{% endmacro %}
